name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Organize files
        run: |
          mkdir -p app/src/main/java/com/bglauncher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/bglauncher/
          mv OverlayService.java app/src/main/java/com/bglauncher/
          mv activity_main.xml app/src/main/res/layout/
          mv overlay_bubble.xml app/src/main/res/layout/
          mv overlay_panel.xml app/src/main/res/layout/
          mv bubble_bg.xml app/src/main/res/drawable/
          mv panel_bg.xml app/src/main/res/drawable/
          mv input_bg.xml app/src/main/res/drawable/
          mv log_bg.xml app/src/main/res/drawable/
          mv ic_launcher.xml app/src/main/res/drawable/
          mv styles.xml app/src/main/res/values/
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.0.0/gradle/wrapper/gradle-wrapper.jar
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlockmanGo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
