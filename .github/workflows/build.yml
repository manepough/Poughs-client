name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Organize files
        run: |
          mkdir -p app/src/main/java/com/bglauncher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mv AndroidManifest.xml app/src/main/
          mv MainActivity.java app/src/main/java/com/bglauncher/
          mv OverlayService.java app/src/main/java/com/bglauncher/
          mv activity_main.xml app/src/main/res/layout/
          mv overlay_bubble.xml app/src/main/res/layout/
          mv overlay_panel.xml app/src/main/res/layout/
          mv bubble_bg.xml app/src/main/res/drawable/
          mv panel_bg.xml app/src/main/res/drawable/
          mv input_bg.xml app/src/main/res/drawable/
          mv log_bg.xml app/src/main/res/drawable/
          mv ic_launcher.xml app/src/main/res/drawable/
          mv styles.xml app/src/main/res/values/
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.bglauncher'
            compileSdk 34
            defaultConfig {
              applicationId "com.bglauncher"
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
          }
          repositories {
            google()
            mavenCentral()
          }
          EOF
          cat > build.gradle << 'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.1'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF
